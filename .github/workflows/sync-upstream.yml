name: Sync upstream plugins

on:
  schedule:
    # daily at 03:00 UTC (= 11:00 Asia/Shanghai)
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Re-sync plugins from upstream
        run: bash sync-upstream.sh

      - name: Commit and push if changed
        run: |
          git config user.name  "marketplace-sync-bot"
          git config user.email "marketplace-sync-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No upstream changes."
          else
            git commit -m "sync upstream $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
